<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마실케어 화면 시안</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1d2733;--sub:#5b6878;--line:#e3e8ee;--pri:#2f6f5e;--pri-soft:#e4f1ec;--warn:#b4690e;--warn-soft:#fdf1e1;--bad:#b8323a;--bad-soft:#fbe7e8;--info:#2f5f9e;--info-soft:#e6eef9;--nav:#1f3a33;--nav-ink:#cfe0da}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5}
.top{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;position:sticky;top:0;z-index:5}
.logo{font-weight:800;color:var(--pri);font-size:18px}
.top input{flex:1;max-width:420px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.top .sp{flex:1}.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--bg);color:var(--sub)}
.wrap{display:flex}
nav{width:250px;background:var(--nav);color:var(--nav-ink);padding:10px 0;flex-shrink:0;min-height:calc(100vh - 52px);position:sticky;top:52px;align-self:flex-start;max-height:calc(100vh - 52px);overflow:auto}
nav .grp{padding:12px 18px 4px;font-size:11px;opacity:.6}
nav a{display:block;padding:7px 18px;color:inherit;text-decoration:none;border-left:3px solid transparent;font-size:13px}
nav a:hover{background:rgba(255,255,255,.06)}nav a.on{background:rgba(255,255,255,.1);border-left-color:#7fd1b4;color:#fff;font-weight:600}
nav a small{opacity:.55;margin-left:4px}
main{flex:1;padding:20px 26px 60px;min-width:0}
h1{font-size:21px;margin:0 0 4px}h2{font-size:16px;margin:26px 0 8px;padding-top:6px;border-top:2px solid var(--ink)}
h3{font-size:14px;margin:18px 0 6px;color:var(--pri)}
.desc{color:var(--sub);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.legacy span,.old{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin:2px 3px 2px 0;font-size:12px;color:var(--sub)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:6px 8px;border:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f0f3f6;font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
td.ty{white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--info)}
td.req{text-align:center;color:var(--bad);font-weight:700;width:34px}
td.src{white-space:nowrap;font-size:12px;color:var(--sub)}
td.opt{font-size:12.5px;color:#333;max-width:420px}
td.nt{font-size:12.5px}
tr.sec td{background:var(--pri-soft);font-weight:700;color:var(--pri)}
tr.sec td .k{font-weight:400;font-size:11px;background:#fff;border-radius:4px;padding:0 6px;margin-left:6px;color:var(--sub)}
.dedupe{color:var(--warn);font-weight:600}.auto{color:var(--info);font-weight:600}
.scroll{overflow-x:auto}
.wf{display:grid;gap:6px;margin:8px 0 4px}
.wf div{border:1.5px dashed #b9c6d2;border-radius:8px;padding:8px 10px;font-size:12px;color:var(--sub);background:#fbfcfd}
.wf b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend code{color:var(--info)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpis b{display:block;font-size:22px}
@media(max-width:900px){nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}main{padding:16px}}
@media print{nav,.top{display:none}main{padding:0}h2{page-break-before:always}}

/* ===== 시안(mockup) ===== */
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:8px;vertical-align:middle}
.viewtog button{border:none;background:var(--panel);padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--sub)}
.viewtog button.on{background:var(--ink);color:#fff}
.mk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.mk h4{margin:0 0 10px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.mk h4 .k{font-weight:400;font-size:11px;color:var(--sub);background:var(--bg);border-radius:4px;padding:1px 6px}
.fbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.fbar label{font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.ctl,.fbar select,.fbar input{font:inherit;font-size:13px;padding:6px 9px;border:1px solid #cfd8e1;border-radius:7px;background:#fff;color:var(--ink);min-width:0}
textarea.ctl{width:100%;min-height:64px;resize:vertical}
.ctl[readonly]{background:#f3f6f8;color:var(--sub)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.form .fi{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:start}
.form .fi.wide{grid-column:span 2}
.form .fi>span{font-size:12.5px;color:var(--sub);padding-top:6px}
.form .fi>span b{color:var(--bad);margin-left:2px}
.form .fi .w{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.form .fi .w .ctl{flex:1;min-width:110px}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;margin-right:8px;white-space:nowrap}
.ck input{accent-color:var(--pri)}
.btnr{display:flex;flex-wrap:wrap;gap:6px}
.bt{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.bt.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.bt.sm{padding:2px 8px;font-size:12px}
.mtab{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.mtab button{border:none;background:none;padding:10px 14px;color:var(--sub);border-bottom:2px solid transparent;font:inherit;cursor:pointer;white-space:nowrap}
.mtab button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px}
.lst .it{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
.lst .it.on{background:var(--pri-soft)}.lst .it:hover{background:var(--bg)}
.av{width:30px;height:30px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.hcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hcard .av{width:54px;height:54px;font-size:20px}
.hcard dl{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;font-size:12.5px}
.hcard dt{color:var(--sub)}.hcard dd{margin:0 0 0 4px;font-weight:600}
.hcard .kv{display:flex}
.ro{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ro div{background:var(--info-soft);border-radius:8px;padding:8px 10px;font-size:12.5px}
.ro div small{display:block;color:var(--info);font-size:11px}
.mt table td,.mt table th{white-space:nowrap;font-size:12.5px}
.mt table td.c{text-align:center}
.tg{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:600}
.t-ok{background:#e5f4ea;color:#2e7d4f}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}.t-mute{background:var(--bg);color:var(--sub)}
.dot{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;border:none}
.d-ok{background:#e5f4ea;color:#2e7d4f}.d-no{background:var(--bad-soft);color:var(--bad);cursor:pointer}.d-na{background:var(--bg);color:#aab}
.rules{font-size:12px;color:var(--sub);columns:2;column-gap:24px;margin:0;padding-left:16px}
.pipe{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.pipe div{flex:1;min-width:130px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.pipe b{display:block;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal div{border:1px solid var(--line);border-radius:6px;min-height:70px;padding:4px;font-size:11px}
.cal div b{font-size:12px}
.cal i{display:block;font-style:normal;border-radius:3px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.L1{background:#e4f1ec}.L2{background:#e6eef9}.L3{background:#fdf1e1}.L4{background:#f1e8f8}
/* dashboard */
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kp .mk{cursor:pointer;margin:0}.kp .n{font-size:26px;font-weight:800;letter-spacing:-1px}.kp .l{color:var(--sub);font-size:12.5px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri)}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.todo{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.todo .t{flex:1}.todo .t small{display:block;color:var(--sub);font-size:12px}
.todo.done .t{opacity:.45;text-decoration:line-through}
.slot{font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 0}
.pill{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.pill button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dl{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
@media(max-width:1000px){.split,.g2{grid-template-columns:1fr}.kp{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.form .fi.wide{grid-column:auto}.form .fi{grid-template-columns:1fr}.rules{columns:1}}

</style>
</head>
<body>
<div class="top"><div class="logo">마실케어</div><span class="chip">화면 시안 + 항목 정의서 v1.1 · 2026-11-27</span><input id="q" placeholder="항목 검색 (예: 본인부담률, 바이탈, 작성자)"><div class="sp"></div><span class="chip" id="cnt"></span></div>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
/* 유형 코드 */
const TY={T:'텍스트',N:'숫자',D:'날짜',DR:'기간',TM:'시:분',DT:'일시',S:'단일선택',R:'라디오',C:'체크',CM:'다중체크',TA:'장문',F:'첨부',P:'선택팝업',A:'자동',B:'버튼',L:'목록컬럼',G:'그리드'};
/* 공통 컴포넌트 (한 번 정의 → 모든 화면 재사용, 중복 제거) */
const COMMON={
 RF:{n:'수급자 공통 조회조건',f:[['현황','S','','대기 / 수급중 / 보류 / 퇴소 (기본: 수급중)','1-1 외 다수',''],['케어그룹','S','','설정 > 케어그룹 코드','1-1 외',''],['본인부담률(분류)','S','','일반 15% / 감경 9% / 감경 7.5% / 감경 6% / 기초 0% / 의료급여 7.5% / 의료 6% / 등급외 100%','1-1, 2-1, 7-1',''],['등급','S','','1~5등급 / 인지지원등급 / 등급외','1-3 외',''],['이름','T','','수급자명 부분일치','공통',''],['기준일','D','','해당 일자 기준 등급·현황 표시','1-1',''],['퇴소자 포함','C','','','1-1, 5-3','']]},
 RH:{n:'수급자 헤더 카드',f:[['사진','A','','','1-1','<span class="auto">자동</span> 수급자 360에서 1회 입력'],['수급자명 (성별/만나이)','A','','','1-1','<span class="auto">자동</span>'],['생년월일','A','','','1-1','<span class="auto">자동</span>'],['등급 / 인정번호 / 인정기간','A','','','1-1','<span class="auto">자동</span>'],['케어그룹','A','','','1-1','<span class="auto">자동</span>'],['급여개시일 (퇴소일)','A','','','1-1','<span class="auto">자동</span>'],['주요질환','A','','','1-1','<span class="auto">자동</span>'],['본인부담률','A','','','1-1','<span class="auto">자동</span>']]},
 SF:{n:'직원 공통 조회조건',f:[['현황','S','','재직 / 휴직 / 퇴사','8-1, 11-3',''],['담당직종','S','','시설장(관리책임자) / 사무국장 / 사회복지사 / 간호사 / 간호조무사 / 물리치료사 / 작업치료사 / 요양보호사 / 영양사 / 사무원 / 조리원 / 보조원(운전사)','8-1 외',''],['이름','T','','','8-1 외',''],['퇴사자·휴직 포함','C','','','8-1','']]},
 STAFF:{n:'직원 선택 (작성자·확인자·담당자)',f:[['직원','S','','재직 직원 "이름 (직종)" · 해당 일자 근무일정 없음 표시 · 로그인 사용자 기본값','전 화면','<span class="dedupe">중복제거</span> 작성자 기본값 = 로그인 사용자']]},
 PER:{n:'기간·탐색',f:[['기간 이동','B','','← 이전 / 다음 → (일·주·월·년 단위)','전 화면',''],['기간 직접 지정','DR','','시작일 ~ 종료일','리포트 전반','']]},
 OUT:{n:'출력·내보내기',f:[['출력','B','','화면별 공식 서식(공단 별지 포함) 출력 · 미리보기','전 화면',''],['엑셀 다운로드','B','','','리포트 전반','']]}
};
const S=[];   /* 화면 정의 */
const MAP={}; /* 기존 메뉴 → 신규 위치 */
const DD='<span class="dedupe">중복제거</span> ', AU='<span class="auto">자동</span> ';
const STAFFOPT='직원 선택(공통)';
/* ---------- 0. 개요 ---------- */
S.push({id:'intro',g:'문서',name:'개요 · 작성 기준',desc:'기존 희망케어 102개 메뉴의 실제 화면(목록 컬럼·조회조건·버튼·등록/수정 팝업 입력항목)을 전수 추출하여, 업무 흐름 기준 13개 화면으로 재배치한 항목 정의서입니다.',
 html:`<div class="kpis"><div>기존 메뉴<b>11그룹 · 102개</b></div><div>신규 화면<b>13개 + 대시보드</b></div><div>공통 컴포넌트<b>6종</b></div><div>중복 입력 제거<b>12개 영역</b></div></div>
 <h3>작성 기준</h3><div class="card"><ol style="margin:0;padding-left:18px">
 <li><b>원천 데이터 1곳 원칙</b> — 같은 값(수급자 기본정보, 출석/이용시간, 바이탈, 보호자 연락처, 계좌 등)은 한 화면에서만 입력하고 나머지는 <span class="auto">자동</span> 표시합니다.</li>
 <li><b>수급자/직원 컨텍스트 유지</b> — 좌측에서 선택한 수급자·직원은 탭/화면 이동 시 유지되어 재검색하지 않습니다.</li>
 <li><b>일괄(매트릭스) ↔ 개인 모드</b> — 같은 기록을 여러 명 한 번에(통합식사·통합간호·특이사항 일괄) 또는 1명 상세로 입력하던 화면을 하나의 화면 + 모드 전환으로 통합합니다.</li>
 <li><b>리포트 분리</b> — 조회·출력 전용 메뉴(약 30개)는 리포트 센터로 모으고, 각 업무 화면 우측 상단 [출력▾]에서도 바로 접근합니다.</li>
 <li><b>항목 표기</b> — 기존 화면 라벨을 그대로 사용(평가·공단 서식 용어 유지). 필수(●)는 기존 화면의 * 표시 기준입니다.</li></ol></div>
 <h3>유형 코드</h3><div class="card legend">${Object.entries(TY).map(([k,v])=>`<span><code>${k}</code> ${v}</span>`).join('')}</div>
 <h3>중복 입력 제거 대상</h3>
 <div class="scroll"><table><thead><tr><th>항목</th><th>기존 (여러 곳 입력)</th><th>신규 원천 (1곳 입력)</th><th>자동 반영 위치</th></tr></thead><tbody>
 ${[['수급자 기본정보','1-1 신규/수정, 1-1-1 대기 등록, 2-1-1·4-2·5-3 팝업 상단 재표시','1. 수급자 360 › 기본정보','모든 기록 팝업의 수급자 헤더 카드, 청구, 공단연동'],
 ['대기 → 수급자 전환','1-1-1 대기 등록 후 1-1에 재입력','1. 수급자 360 (현황=대기)','[수급자 전환] 시 이름·성별·나이·등급·주소·병력·보호자 이관'],
